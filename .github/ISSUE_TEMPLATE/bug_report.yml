name: "🐛 Bug Report"
description: File a reproducible bug report to help us improve Dakly.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please ensure this issue has not already been reported by searching open and closed issues.
  - type: input
    id: version
    attributes:
      label: Dakly Version
      description: What version of Dakly or SDK are you using? (e.g., v1.2.1, @dakly/sdk@1.0.0, python-dakly@1.0.0)
      placeholder: "e.g. 1.2.1"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the system is failing?
      options:
        - "Backend Engine API"
        - "Web Dashboard (Frontend)"
        - "Node.js SDK (npm)"
        - "Python SDK (PyPI)"
        - "Webhooks & HMAC Verification"
        - "Tracking Analytics (Open / Click)"
        - "Warm-up / Bounce Suppression"
        - "IP Whitelisting & Security"
        - "Email Templates & Dynamic Engine"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I call mailer.sendOtp() with invalid parameters..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: Clear steps to reproduce the behavior.
      placeholder: |
        1. Initialize Dakly client with '...'
        2. Execute method '...'
        3. Observe error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any console logs, terminal output, or stack traces (redact secrets/keys!).
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have verified that this issue does NOT disclose sensitive API keys or Gmail credentials.
          required: true
        - label: I have verified that this issue has not already been filed.
          required: true
