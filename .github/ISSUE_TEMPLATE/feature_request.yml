name: "💡 Feature Request"
description: Propose a new feature, new email template, or SDK enhancement for Dakly.
title: "[FEATURE]: "
labels: ["enhancement", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to Dakly! Please describe the use case and proposed solution clearly.
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What area does this feature relate to?
      options:
        - "New Email Template"
        - "SDK Feature (Node.js / Python)"
        - "New Language SDK (Go, Rust, PHP, etc.)"
        - "Dashboard UI / Analytics"
        - "Webhooks / Integrations"
        - "Security / Access Control"
        - "Engine Performance / Pacing"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: "Add support for..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches Considered
      description: Describe any alternative solutions or features you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context or Mockups
      description: Add any other context, screenshots, or API syntax ideas.
