<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="daklyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Primary Brand Gradient (Indigo -> Violet) -->
    <linearGradient id="daklyBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Lightning Bolt Gradient (Amber -> Cyan/White) -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1:1 Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#daklyBg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#6366F1" stroke-opacity="0.25" stroke-width="4" />

  <!-- Subtle Background Grid (Dev/Engine Aesthetic) -->
  <g stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="2">
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
  </g>

  <!-- Envelope Base Backplate -->
  <rect x="96" y="148" width="320" height="224" rx="28" fill="#1E293B" stroke="url(#daklyBrand)" stroke-width="10" />

  <!-- Envelope Bottom Folds -->
  <path d="M 104 360 L 220 260 M 408 360 L 292 260" stroke="#475569" stroke-width="8" stroke-linecap="round" />

  <!-- Envelope Top Flap (Open/Fast Dispatch) -->
  <path d="M 102 158 L 236 266 C 248 275 264 275 276 266 L 410 158" fill="none" stroke="url(#daklyBrand)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sub-Second Lightning Bolt (Breaking Out of the Envelope) -->
  <path d="M 284 88 L 188 244 H 264 L 228 416 L 348 236 H 268 L 284 88 Z" fill="url(#boltGrad)" filter="url(#glow)" />
  <path d="M 284 88 L 188 244 H 264 L 228 416 L 348 236 H 268 L 284 88 Z" fill="url(#boltGrad)" stroke="#0F172A" stroke-width="8" stroke-linejoin="round" />

  <!-- Live Status Telemetry Dot (250 OK) -->
  <circle cx="396" cy="148" r="18" fill="#10B981" stroke="#0F172A" stroke-width="6" />
</svg>