<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with Deep Space Gradients -->
  <rect width="1200" height="630" fill="#080a0f"/>
  
  <!-- Radial Glow Accents -->
  <circle cx="200" cy="150" r="300" fill="#6366f1" fill-opacity="0.18" filter="blur(120px)"/>
  <circle cx="1000" cy="500" r="350" fill="#8b5cf6" fill-opacity="0.15" filter="blur(140px)"/>
  <circle cx="600" cy="300" r="250" fill="#10b981" fill-opacity="0.08" filter="blur(100px)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.12">
    <path d="M0 105 H1200 M0 210 H1200 M0 315 H1200 M0 420 H1200 M0 525 H1200" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8"/>
    <path d="M150 0 V630 M300 0 V630 M450 0 V630 M600 0 V630 M750 0 V630 M900 0 V630 M1050 0 V630" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8"/>
  </g>

  <!-- Top Badge -->
  <g transform="translate(100, 95)">
    <rect width="360" height="38" rx="19" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="6" fill="#10b981"/>
    <text x="38" y="24" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">LIVE ON PORT 587 STARTTLS</text>
  </g>

  <!-- Logo & Title Section -->
  <g transform="translate(100, 175)">
    <!-- Brand Icon -->
    <rect width="84" height="84" rx="22" fill="#6366f1" fill-opacity="0.18" stroke="#818cf8" stroke-width="2"/>
    <path d="M26 34 L42 48 L58 34" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="32" width="36" height="26" rx="5" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Title -->
    <text x="108" y="60" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
      Dakly<tspan fill="#818cf8">.io</tspan>
    </text>
  </g>

  <!-- Headline & Subtitle -->
  <g transform="translate(100, 310)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Headless Transactional Email Engine
    </text>
    <text x="0" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">
      Zero-setup microservice that scales free Gmail pools into high-speed production relays.
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(100, 440)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="52" rx="14" fill="#1e2230" stroke="#334155" stroke-width="1.5"/>
      <text x="24" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">🛡️ Multi-Gmail Failover</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(230, 0)">
      <rect width="210" height="52" rx="14" fill="#1e2230" stroke="#334155" stroke-width="1.5"/>
      <text x="24" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">🔥 Smart Warm-Up</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(460, 0)">
      <rect width="210" height="52" rx="14" fill="#1e2230" stroke="#334155" stroke-width="1.5"/>
      <text x="24" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">🏷️ Sender Aliases</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(690, 0)">
      <rect width="230" height="52" rx="14" fill="#1e2230" stroke="#334155" stroke-width="1.5"/>
      <text x="24" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">🔐 AES-256-GCM Vault</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(100, 560)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', monospace" font-size="15" font-weight="500">
      https://dakly.cc.cd • Open-Source Developer API
    </text>
  </g>
</svg>
