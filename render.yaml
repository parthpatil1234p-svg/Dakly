services:
  - type: web
    name: dakly-email-engine
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
